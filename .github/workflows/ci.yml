name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and development tools
        run: python -m pip install -e '.[dev]'
      - name: Verify tracked release evidence
        run: python scripts/verify_release_evidence.py docs/release-evidence/android-mvp-debug-apk-2026-08-14.json
      - name: Verify versioned OpenAPI contract
        run: python scripts/export_openapi.py --check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dashboard dependencies
        run: npm ci
      - name: Lint
        run: npm run dashboard:lint
      - name: Type check
        run: npm run dashboard:typecheck
      - name: Test
        run: npm run dashboard:test
      - name: Build
        run: npm run dashboard:build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Install locked mobile dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug --dart-define=ZENIT_API_BASE_URL=https://api.example.invalid
      - name: Verify debug Android APK
        run: |
          python ../../scripts/verify_android_apk.py \
            build/app/outputs/flutter-apk/app-debug.apk \
            --expected-application-id br.com.zenit.zenit_mobile \
            --expected-version-name 1.0.0 \
            --expected-version-code 1 \
            --expected-min-sdk 24 \
            --expected-target-sdk 36 \
            --configured-api-base-url https://api.example.invalid \
            --evidence-out build/app/outputs/flutter-apk/app-debug.evidence.json

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [api, dashboard, mobile]
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: zenit-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build and start a fresh stack
        run: docker compose up --build --wait --wait-timeout 240
      - name: Verify migrated schema
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U zenit -d zenit -Atc \
            "SELECT to_regclass('public.source_file') IS NOT NULL
                AND to_regclass('public.road_segment') IS NOT NULL
                AND to_regclass('public.vegetation_analysis') IS NOT NULL
                AND to_regclass('public.recommendation_review') IS NOT NULL
                AND to_regclass('public.app_user') IS NOT NULL
                AND to_regclass('public.recommendation_review_policy') IS NOT NULL
                AND to_regclass('public.inspection_order_policy') IS NOT NULL
                AND to_regclass('public.work_order') IS NOT NULL
                AND to_regclass('public.work_order_planned_point') IS NOT NULL
                AND to_regclass('public.mobile_device_registration') IS NOT NULL
                AND to_regclass('public.mobile_sync_batch') IS NOT NULL
                AND to_regclass('public.mobile_sync_event') IS NOT NULL
                AND to_regclass('public.mobile_sync_conflict') IS NOT NULL
                AND to_regclass('public.prepared_field_measurement') IS NOT NULL
                AND to_regclass('public.prepared_inspection_summary') IS NOT NULL
                AND to_regclass('public.prepared_inspection_summary_export_event') IS NOT NULL
                AND to_regclass('public.prepared_post_inspection_proposal') IS NOT NULL
                AND to_regclass('public.prepared_post_inspection_review') IS NOT NULL
                AND to_regclass('public.prepared_mowing_order') IS NOT NULL
                AND to_regclass('public.prepared_mowing_resource_plan') IS NOT NULL
                AND to_regclass('public.prepared_mowing_readiness_assessment') IS NOT NULL
                AND to_regclass('public.prepared_mowing_planning_approval') IS NOT NULL
                AND to_regclass('public.prepared_mowing_demo_event') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_measurement') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_photo_manifest') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_photo_upload_receipt') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_photo_access_event') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_photo_human_review') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_summary') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_summary_export_event') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_exception') IS NOT NULL
                AND to_regclass('public.prepared_mowing_post_service_exception_review') IS NOT NULL
                AND to_regclass('public.authentication_login_throttle') IS NOT NULL
                AND to_regclass('public.authentication_login_attempt') IS NOT NULL;" \
            | grep -qx t
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U zenit -d zenit -Atc \
            "SELECT postgis_typmod_type(a.atttypmod)
               FROM pg_attribute a
               JOIN pg_class c ON c.oid = a.attrelid
              WHERE c.relname = 'satellite_scene' AND a.attname = 'footprint';" \
            | grep -qx MultiPolygon
      - name: Verify service contracts
        run: python scripts/verify_mvp_stack.py --expect-empty
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
