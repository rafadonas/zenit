name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dashboard dependencies
        run: npm ci
      - name: Lint
        run: npm run dashboard:lint
      - name: Type check
        run: npm run dashboard:typecheck
      - name: Test
        run: npm run dashboard:test
      - name: Build
        run: npm run dashboard:build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Install locked mobile dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug --dart-define=ZENIT_API_BASE_URL=https://api.example.invalid

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [api, dashboard, mobile]
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: zenit-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build and start a fresh stack
        run: docker compose up --build --wait --wait-timeout 240
      - name: Verify migrated schema
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U zenit -d zenit -Atc \
            "SELECT to_regclass('public.source_file') IS NOT NULL
                AND to_regclass('public.road_segment') IS NOT NULL
                AND to_regclass('public.vegetation_analysis') IS NOT NULL
                AND to_regclass('public.recommendation_review') IS NOT NULL
                AND to_regclass('public.app_user') IS NOT NULL
                AND to_regclass('public.recommendation_review_policy') IS NOT NULL
                AND to_regclass('public.inspection_order_policy') IS NOT NULL
                AND to_regclass('public.work_order') IS NOT NULL
                AND to_regclass('public.work_order_planned_point') IS NOT NULL
                AND to_regclass('public.mobile_device_registration') IS NOT NULL
                AND to_regclass('public.mobile_sync_batch') IS NOT NULL
                AND to_regclass('public.mobile_sync_event') IS NOT NULL
                AND to_regclass('public.mobile_sync_conflict') IS NOT NULL
                AND to_regclass('public.prepared_field_measurement') IS NOT NULL
                AND to_regclass('public.prepared_inspection_summary') IS NOT NULL
                AND to_regclass('public.prepared_inspection_summary_export_event') IS NOT NULL
                AND to_regclass('public.prepared_post_inspection_proposal') IS NOT NULL;" \
            | grep -qx t
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U zenit -d zenit -Atc \
            "SELECT postgis_typmod_type(a.atttypmod)
               FROM pg_attribute a
               JOIN pg_class c ON c.oid = a.attrelid
              WHERE c.relname = 'satellite_scene' AND a.attname = 'footprint';" \
            | grep -qx MultiPolygon
      - name: Verify service contracts
        run: |
          curl --fail --silent --show-error http://localhost:8000/health \
            | python -c "import json,sys; payload=json.load(sys.stdin); assert payload['status'] == 'ok'"
          curl --fail --silent --show-error \
            http://localhost:8000/v1/segments/00000000-0000-4000-8000-000000000001/satellite-observations \
            | python -c "import json,sys; payload=json.load(sys.stdin); assert payload['items'] == []; assert payload['metadata']['result_count'] == 0"
          curl --fail --silent --show-error http://localhost:8000/v1/recommendations \
            | python -c "import json,sys; payload=json.load(sys.stdin); assert payload['items'] == []; assert payload['metadata']['result_count'] == 0"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/v1/auth/me)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-auth-check' \
            -d '{"decision":"accepted"}' \
            http://localhost:8000/v1/recommendations/00000000-0000-4000-8000-000000000001/decisions)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/v1/work-orders)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-order-check' \
            -d '{"source_review_id":"00000000-0000-4000-8000-000000000001","planning_rationale":"CI authentication boundary"}' \
            http://localhost:8000/v1/work-orders)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            http://localhost:8000/v1/mobile/devices)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            http://localhost:8000/v1/sync/batch)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-export-check' \
            -d '{"export_purpose":"CI authentication boundary"}' \
            http://localhost:8000/v1/prepared-inspection-summaries/00000000-0000-4000-8000-000000000001/exports)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-proposal-check' \
            -d '{"creation_rationale":"CI authentication boundary"}' \
            http://localhost:8000/v1/prepared-inspection-summaries/00000000-0000-4000-8000-000000000001/post-inspection-proposal)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/v1/prepared-post-inspection-proposals)" = 401
          curl --fail --silent --show-error --output /dev/null http://localhost:3000
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/login
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
