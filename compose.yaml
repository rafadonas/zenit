name: zenit

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenit}
      POSTGRES_USER: ${POSTGRES_USER:-zenit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/migrations/0001_source_catalog_and_staging.sql:/docker-entrypoint-initdb.d/0001.sql:ro
      - ./infra/migrations/0002_allow_invalid_staging_polygons.sql:/docker-entrypoint-initdb.d/0002.sql:ro
      - ./infra/migrations/0003_road_axis_candidates_and_segments.sql:/docker-entrypoint-initdb.d/0003.sql:ro
      - ./infra/migrations/0004_satellite_analysis_foundation.sql:/docker-entrypoint-initdb.d/0004.sql:ro
      - ./infra/migrations/0005_satellite_scene_discovery.sql:/docker-entrypoint-initdb.d/0005.sql:ro
      - ./infra/migrations/0006_satellite_scene_multipolygon.sql:/docker-entrypoint-initdb.d/0006.sql:ro
      - ./infra/migrations/0007_partial_satellite_cache.sql:/docker-entrypoint-initdb.d/0007.sql:ro
      - ./infra/migrations/0008_recommendation_review_audit.sql:/docker-entrypoint-initdb.d/0008.sql:ro
      - ./infra/migrations/0009_identity_and_review_policy.sql:/docker-entrypoint-initdb.d/0009.sql:ro
      - ./infra/migrations/0010_prepared_inspection_orders.sql:/docker-entrypoint-initdb.d/0010.sql:ro
      - ./infra/migrations/0011_prepared_mobile_sync.sql:/docker-entrypoint-initdb.d/0011.sql:ro
      - ./infra/migrations/0012_prepared_demo_order_events.sql:/docker-entrypoint-initdb.d/0012.sql:ro
      - ./infra/migrations/0013_prepared_photo_manifest.sql:/docker-entrypoint-initdb.d/0013.sql:ro
      - ./infra/migrations/0014_require_demo_finish_photos.sql:/docker-entrypoint-initdb.d/0014.sql:ro
      - ./infra/migrations/0015_prepared_photo_upload_receipt.sql:/docker-entrypoint-initdb.d/0015.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-zenit}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-zenit}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zenit:change_me@postgres:5432/zenit}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-development-only-change-this-authentication-secret}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-30}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-zenit}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-zenit-api}
      RECOMMENDATION_REVIEW_POLICY_VERSION: ${RECOMMENDATION_REVIEW_POLICY_VERSION:-recommendation-review-mvp-v1}
      INSPECTION_ORDER_POLICY_VERSION: ${INSPECTION_ORDER_POLICY_VERSION:-prepared-inspection-order-v1}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-zenit}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change_me}
      OBJECT_STORAGE_BUCKET_MEDIA: ${OBJECT_STORAGE_BUCKET_MEDIA:-zenit-media}
      OBJECT_STORAGE_MEDIA_ENCRYPTION_KEY: ${OBJECT_STORAGE_MEDIA_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtb25seS0zMi1ieXRlLWtleSEhISE=}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      INTERNAL_API_URL: http://api:8000
      DASHBOARD_APP_ENV: ${APP_ENV:-development}
      DASHBOARD_PUBLIC_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:-http://localhost:3000}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
